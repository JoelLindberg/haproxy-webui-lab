{% extends "base.html" %}

{% block title %}{{ backend.name }} · Server Management{% endblock %}

{% block body %}
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
  {% include "core/partials/header.html" %}

  <div class="mb-5">
    <a
      href="{% url 'dashboard' %}"
      class="inline-flex items-center gap-2 rounded-xl surface-card border border-slate-300 dark:border-slate-700 px-4 py-2 text-sm font-medium text-slate-700 dark:text-slate-200 hover:border-indigo-500 hover:text-indigo-600 dark:hover:text-indigo-400 shadow-xs transition"
    >
      <span aria-hidden="true">←</span>
      <span>Back to Dashboard</span>
    </a>
  </div>

  <div id="backend-workspace">
    {% include "core/partials/backend_workspace.html" %}
  </div>
</div>
{% endblock %}
